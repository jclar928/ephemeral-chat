services:
  - type: web
    name: ephemeral-chat-v2
    runtime: node
    rootDir: chat
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_CONTROL_SECRET
        generateValue: true
  - type: web
    name: ephemeral-chat-v2-admin
    runtime: node
    rootDir: admin
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_CONTROL_SECRET
        sync: false
      - key: CHAT_SERVICE_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_CHAT_SERVICE_ID
        sync: false
