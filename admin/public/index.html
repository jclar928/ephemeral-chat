<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ephemeral Chat Owner</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><small>EPHEMERAL CHAT · NO-CLOUD EDITION</small><h1>Owner console</h1></div><button id="logout" class="hidden">Log out</button></header><section id="login" class="panel"><h2>Owner sign in</h2><input id="password" type="password" placeholder="Owner password"><button id="loginBtn">Sign in</button><p id="loginError"></p></section><div id="dash" class="hidden"><section class="stats"><div class="panel">ACTIVE ROOMS<b id="rooms">—</b></div><div class="panel">CONNECTED PEOPLE<b id="people">—</b></div><div class="panel">MEDIA STORAGE<b id="storage">Peer-to-peer</b></div></section><section class="panel"><h2>Website controls</h2><button id="refresh">Refresh</button><button id="clear" class="danger">Clear all chats for everyone</button><p>Clear-all removes active rooms and messages from server memory and disconnects participants.</p><button id="stop" class="danger">Stop chat service</button><button id="start">Start / resume chat service</button></section><section class="panel"><h2>Settings</h2><label>Maximum file transfer size <select id="max"><option>1</option><option>2</option><option>5</option><option>10</option></select> GB</label><label><input id="watermark" type="checkbox"> Show confidentiality watermark</label><label><input id="blur" type="checkbox"> Blur when browser loses focus (deterrent only)</label><label><input id="maintenance" type="checkbox"> Maintenance mode</label><button id="save">Save settings</button></section><p id="msg"></p></div></main><script src="/app.js"></script></body></html>
