<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ephemeral Chat</title><link rel="stylesheet" href="/style.css"></head><body><main><header>✳ EPHEMERAL CHAT <small>NO-CLOUD EDITION</small></header><section id="entry" class="panel"><p>PRIVATE TWO-PERSON ROOM</p><h1>A space to talk.</h1><label>Your name<input id="name" placeholder="Name" maxlength="24"></label><label>Room code<input id="code" maxlength="8" placeholder="BLUE42"></label><button id="generate">Generate code</button><button id="join">Join room</button><p id="entryError"></p></section><section id="chat" class="panel hidden"><div class="roombar">ROOM <b id="room"></b> <span id="people"></span><button id="invite">Copy invite</button></div><div id="connection">Connecting directly to the other person…</div><div id="messages"></div><label>Send an image, GIF or video <input id="file" type="file" accept="image/*,video/*"></label><button id="sendFile">Send file directly</button><progress id="progress" max="100" value="0"></progress><p id="transferStatus"></p><section id="incoming" class="incoming hidden"><b id="incomingName"></b><p id="incomingInfo"></p><button id="accept">Choose save location & accept</button><button id="reject" class="danger">Decline</button></section><textarea id="text" placeholder="Message"></textarea><button id="send">Send message</button><p id="chatError"></p><button id="leave" class="secondary">Leave room</button></section><footer id="watermark">PRIVATE CHAT · DIRECT TRANSFER</footer></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
